# HYPRLOCK CONFIGURATION
# Color Palette: Prussian Blue & Gold/Cyan accents

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    # Deep Prussian Blue Background
    color = rgba(0, 49, 83, 1.0)
    
    # Optional: Path to a dark wallpaper
    # path = /home/user/pictures/wallpapers/dark_blue.png
    blur_passes = 3 
    blur_size = 8
}

label {
    monitor =
    text = 
    font_size = 24
    position = 0, 8
    halign = left
    valign = top
    font_family = CommitMono Nerd Font Mono
    onclick = poweroff
    color = rgba(224, 247, 250, 0.2)
}

# TIME
label {
    monitor =
    text = $TIME
    # Bright White with a hint of Cyan
    color = rgba(224, 247, 250, 0.9)
    font_size = 120
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text = Welcome back, $USER
    # Subtle Gold/Brass accent
    color = color = rgba(255, 255, 255, 0.9)
    font_size = 25
    font_family = CommitMono Nerd Font Mono
    position = 0, -40
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 60
    outline_thickness = 4
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    
    # Border: Lighter Blue / Inner: Darker Navy
    outer_color = rgba(0, 168, 204, 1.0)
    inner_color = rgba(10, 25, 47, 0.6)
    font_color = rgba(224, 247, 250, 1.0)
    
    fade_on_empty = true
    placeholder_text = <span foreground="##00a8cc">Identify Yourself...</span>
    hide_input = false
    
    # Caps Lock color change (Red alert)
    check_color = rgba(255, 102, 102, 1.0)
    fail_color = rgba(255, 0, 0, 1.0)
    
    position = 0, -120
    halign = center
    valign = center
}
