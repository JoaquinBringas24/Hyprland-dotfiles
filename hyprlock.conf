# HYPRLOCK CONFIGURATION
# Color Palette: Pastel Pink & White

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    # Soft Pastel Pink Background
    color = rgba(255, 218, 224, 1.0)
    
    # Optional: If you have a wallpaper, uncomment the line below
    # path = /home/user/pictures/wallpapers/pink_aesthetic.png
    blur_passes = 2 
    blur_size = 7
}

label {
    monitor = 
    text = 󰐥
    font_size = 24
    haling = left
    valign = top
    color = rgba(240, 140, 158, 0.6)
    onclick = poweroff
    position = -951, 11 
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 120
    font_family = JetBrains Mono Nerd Font ExtraBold
    position = 0, 80
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text = Hello, $USER
    color = rgba(240, 140, 158, 1.0)
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    
    # Outer color (Pastel Pink) / Inner color (White)
    outer_color = rgba(255, 182, 193, 1.0)
    inner_color = rgba(255, 255, 255, 0.3)
    font_color = rgb(200, 100, 120)
    
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    
    position = 0, -120
    halign = center
    valign = center
}
